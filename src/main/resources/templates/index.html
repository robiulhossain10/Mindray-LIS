<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIS | Mindray BS-240 Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glow-green { box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        .table-row-new { animation: slideIn 0.5s ease-out forwards; background-color: #f0fdf4; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900">

<header class="sticky top-0 z-50 w-full border-b border-slate-200 bg-white/80 backdrop-blur-md">
    <div class="container mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <div class="bg-indigo-600 p-2 rounded-lg shadow-lg">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight">Mindray BS-240</h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Live LIS Integration</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 px-3 py-1 bg-slate-100 rounded-full">
                <div id="server-dot" class="w-2 h-2 rounded-full bg-slate-400"></div>
                <span id="server-text" class="text-[10px] font-bold text-slate-600 uppercase">Server: Off</span>
            </div>
            <div id="machine-indicator" class="flex items-center gap-2 px-4 py-1.5 bg-red-50 border border-red-100 rounded-full transition-all duration-500">
                <div id="machine-dot" class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
                <span id="machine-text" class="text-xs font-black text-red-600 uppercase tracking-tighter">Machine: Offline</span>
            </div>
        </div>
    </div>
</header>

<main class="container mx-auto px-4 py-8">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <p class="text-xs font-bold text-slate-400 uppercase mb-1">Total Tests</p>
            <h3 id="stat-total" class="text-3xl font-black text-slate-800">0</h3>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm border-l-4 border-l-indigo-500">
            <p class="text-xs font-bold text-slate-400 uppercase mb-1">Last Sample ID</p>
            <h3 id="stat-last-id" class="text-2xl font-black text-indigo-600">---</h3>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <p class="text-xs font-bold text-slate-400 uppercase mb-1">Last Update</p>
            <h3 id="stat-time" class="text-xl font-bold text-slate-700">--:--:--</h3>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <p class="text-xs font-bold text-slate-400 uppercase mb-1">Data Rate</p>
            <h3 class="text-xl font-bold text-emerald-500">Live Stream</h3>
        </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
            <h2 class="font-bold text-slate-800 flex items-center gap-2">
                <span class="w-2 h-5 bg-indigo-500 rounded-full"></span>
                Live Transmission Feed
            </h2>
            <div class="flex gap-2">
                <button onclick="fetchLatestData()" class="text-[10px] font-bold bg-white border border-slate-200 px-3 py-1 rounded-md hover:bg-slate-50">SYNC RECENT</button>
                <button onclick="clearTable()" class="text-[10px] font-bold text-red-600 bg-red-50 px-3 py-1 rounded-md hover:bg-red-100">CLEAR</button>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                <tr class="bg-slate-50 text-slate-500 text-[10px] uppercase tracking-widest font-black">
                    <th class="px-6 py-4">Status</th>
                    <th class="px-6 py-4">Sample ID</th>
                    <th class="px-6 py-4">Analyte</th>
                    <th class="px-6 py-4 text-center">Result</th>
                    <th class="px-6 py-4">Unit</th>
                    <th class="px-6 py-4 text-right">Time</th>
                </tr>
                </thead>
                <tbody id="results-table" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
        <div id="empty-state" class="py-20 text-center">
            <p class="text-slate-400 text-sm font-medium">Waiting for analyzer data stream...</p>
        </div>
    </div>
</main>

<script>
    let stompClient = null;
    let testCount = 0;

    // ১. শুরুতে মেশিনের বর্তমান স্ট্যাটাস চেক করা
    async function checkInitialStatus() {
        try {
            const response = await fetch('/api/status/machine');
            const data = await response.json();
            handleMachineStatus(data.connected);
        } catch (e) {
            console.error("Status API not found, waiting for WebSocket...");
        }
    }

    // ২. রিলোড দিলে আগের কিছু ডাটা ডাটাবেস থেকে নিয়ে আসা
    async function fetchLatestData() {
        try {
            const response = await fetch('/api/results/latest');
            const data = await response.json();
            document.getElementById('results-table').innerHTML = ''; // টেবিল ক্লিন
            data.slice(0, 10).forEach(res => handleNewResult(res, false)); // লেটেস্ট ১০টি
        } catch (e) { console.log("Load error"); }
    }

    function connect() {
        const socket = new SockJS('/ws-lis');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, (frame) => {
            updateServerStatus(true);
            checkInitialStatus(); // কানেক্ট হওয়ার পর স্ট্যাটাস চেক

            stompClient.subscribe('/topic/results', (msg) => {
                handleNewResult(JSON.parse(msg.body), true);
            });

            stompClient.subscribe('/topic/connection', (msg) => {
                handleMachineStatus(msg.body === "CONNECTED");
            });

        }, (err) => {
            updateServerStatus(false);
            handleMachineStatus(false);
            setTimeout(connect, 5000);
        });
    }

    function updateServerStatus(isUp) {
        const dot = document.getElementById('server-dot');
        const text = document.getElementById('server-text');
        dot.className = `w-2 h-2 rounded-full ${isUp ? 'bg-emerald-500' : 'bg-red-500'}`;
        text.innerText = isUp ? 'Server: Online' : 'Server: Offline';
    }

    function handleMachineStatus(isOnline) {
        const indicator = document.getElementById('machine-indicator');
        const dot = document.getElementById('machine-dot');
        const text = document.getElementById('machine-text');

        if (isOnline) {
            indicator.className = "flex items-center gap-2 px-4 py-1.5 bg-emerald-50 border border-emerald-100 rounded-full glow-green";
            dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
            text.className = "text-xs font-black text-emerald-600 uppercase tracking-tighter";
            text.innerText = "Machine: Online";
        } else {
            indicator.className = "flex items-center gap-2 px-4 py-1.5 bg-red-50 border border-red-100 rounded-full";
            dot.className = "w-2.5 h-2.5 rounded-full bg-red-500";
            text.className = "text-xs font-black text-red-600 uppercase tracking-tighter";
            text.innerText = "Machine: Offline";
        }
    }

    function handleNewResult(data, isNew) {
        document.getElementById('empty-state').classList.add('hidden');
        testCount++;
        const time = new Date(data.createdAt).toLocaleTimeString();

        document.getElementById('stat-total').innerText = testCount;
        document.getElementById('stat-last-id').innerText = data.sampleId;
        document.getElementById('stat-time').innerText = time;

        const tbody = document.getElementById('results-table');
        const row = tbody.insertRow(0);
        if(isNew) row.className = "table-row-new";

        row.innerHTML = `
                <td class="px-6 py-4"><span class="flex h-2 w-2 rounded-full bg-indigo-500"></span></td>
                <td class="px-6 py-4 font-bold text-slate-700">${data.sampleId}</td>
                <td class="px-6 py-4"><span class="px-2 py-1 bg-slate-100 rounded text-[10px] font-black text-slate-600 uppercase">${data.testCode}</span></td>
                <td class="px-6 py-4 text-center font-black text-indigo-600 text-lg">${data.resultValue}</td>
                <td class="px-6 py-4 text-slate-500 font-bold text-xs">${data.unit || '-'}</td>
                <td class="px-6 py-4 text-right text-slate-400 text-[10px] font-mono">${time}</td>
            `;
    }

    function clearTable() {
        document.getElementById('results-table').innerHTML = '';
        document.getElementById('empty-state').classList.remove('hidden');
    }

    window.onload = () => {
        connect();
        fetchLatestData();
    };
</script>
</body>
</html>
